<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Smart Commute</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="auth-page">

    <header class="navbar">

        <div class="nav-container">

            <a href="index.html" class="logo">
                <span class="logo-icon">SC</span>
                <span>Smart Commute</span>
            </a>

            <a href="index.html" class="back-link">
                ← Home
            </a>

        </div>

    </header>


    <main class="auth-container register-container">

        <div class="auth-card">

            <div class="auth-heading">

                <div class="auth-icon">+</div>

                <span class="section-label">GET STARTED</span>

                <h1>Create your account</h1>

                <p>
                    Set up your profile to find or offer a ride.
                </p>

            </div>


            <form id="registerForm" class="auth-form">

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="mobileNumber">
                            Mobile Number
                        </label>

                        <input
                            type="tel"
                            id="mobileNumber"
                            placeholder="10-digit mobile number"
                            maxlength="10"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="registerEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="you@example.com"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        How will you use Smart Commute?
                    </label>

                    <div class="role-options">

                        <label class="role-option">

                            <input
                                type="radio"
                                name="userRole"
                                value="requester"
                                checked
                            >

                            <span>
                                <strong>Find a Ride</strong>
                                <small>I need a ride</small>
                            </span>

                        </label>


                        <label class="role-option">

                            <input
                                type="radio"
                                name="userRole"
                                value="provider"
                            >

                            <span>
                                <strong>Offer a Ride</strong>
                                <small>I can provide a ride</small>
                            </span>

                        </label>


                        <label class="role-option">

                            <input
                                type="radio"
                                name="userRole"
                                value="both"
                            >

                            <span>
                                <strong>Both</strong>
                                <small>I may need or offer rides</small>
                            </span>

                        </label>

                    </div>

                </div>


                <div id="vehicleFields" class="vehicle-fields hidden">

                    <div class="form-row">

                        <div class="form-group">

                            <label for="vehicleType">
                                Vehicle Type
                            </label>

                            <select id="vehicleType">

                                <option value="">
                                    Select vehicle
                                </option>

                                <option value="bike">
                                    Motorcycle / Scooter
                                </option>

                                <option value="car">
                                    Car
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="vehicleModel">
                                Vehicle Model
                            </label>

                            <input
                                type="text"
                                id="vehicleModel"
                                placeholder="e.g. Honda Activa 6G"
                            >

                        </div>

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label for="vehicleNumber">
                                Vehicle Number
                            </label>

                            <input
                                type="text"
                                id="vehicleNumber"
                                placeholder="e.g. MH-15-AB-1234"
                            >

                        </div>


                        <div class="form-group">

                            <label for="availableSeats">
                                Available Seats
                            </label>

                            <select id="availableSeats">

                                <option value="1">1 seat</option>
                                <option value="2">2 seats</option>
                                <option value="3">3 seats</option>
                                <option value="4">4 seats</option>

                            </select>

                        </div>

                    </div>

                </div>


                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <label class="terms-label">

                    <input
                        type="checkbox"
                        id="acceptTerms"
                        required
                    >

                    <span>
                        I agree to use Smart Commute responsibly and provide
                        accurate information.
                    </span>

                </label>


                <button
                    type="submit"
                    class="btn btn-primary btn-full"
                >
                    Create Account
                </button>


                <p id="registerMessage" class="form-message"></p>

            </form>


            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <script src="js/app.js"></script>

</body>
</html>

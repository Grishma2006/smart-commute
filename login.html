<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Login | SmartCommute</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f6f8f6;
    color:#14221c;
}

.navbar{
    height:78px;
    background:white;
    border-bottom:1px solid #e2e8e4;
    display:flex;
    align-items:center;
}

.nav-inner{
    width:min(1180px,92%);
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
    color:#14221c;
}

.logo{
    width:48px;
    height:48px;
    border-radius:14px;
    background:#087a52;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
}

.brand h2{
    font-size:19px;
}

.brand p{
    font-size:11px;
    color:#748078;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:22px;
}

.nav-links a{
    text-decoration:none;
    color:#17231e;
    font-size:14px;
}

.nav-btn{
    background:#087a52;
    color:white!important;
    padding:11px 19px;
    border-radius:10px;
    font-weight:700;
}

.page{
    min-height:calc(100vh - 78px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:35px 20px;
    background:
        radial-gradient(circle at 50% 10%,#e6f5ed,transparent 38%),
        #f6f8f6;
}

.login-card{
    width:min(430px,100%);
    background:white;
    border:1px solid #e0e7e3;
    border-radius:22px;
    padding:34px;
    box-shadow:0 20px 55px rgba(18,52,40,.09);
}

.back{
    color:#68756e;
    font-size:13px;
    text-decoration:none;
}

.icon{
    width:53px;
    height:53px;
    border-radius:15px;
    background:#e5f4ed;
    color:#087a52;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
    margin:22px auto 17px;
}

h1{
    text-align:center;
    font-size:28px;
}

.subtitle{
    text-align:center;
    color:#6c7872;
    font-size:13px;
    margin:5px 0 27px;
}

.form-group{
    margin-bottom:17px;
}

label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
}

.input{
    position:relative;
}

.input span{
    position:absolute;
    left:13px;
    top:13px;
}

input{
    width:100%;
    height:47px;
    border:1px solid #d8e1dc;
    border-radius:10px;
    padding:0 13px 0 39px;
    outline:none;
    font-size:13px;
}

input:focus{
    border-color:#087a52;
    box-shadow:0 0 0 3px rgba(8,122,82,.08);
}

.password{
    position:relative;
}

.password button{
    position:absolute;
    right:12px;
    top:11px;
    border:0;
    background:none;
    cursor:pointer;
}

.password input{
    padding-right:42px;
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:11px;
    color:#69766f;
    margin:5px 0 18px;
}

.remember{
    display:flex;
    gap:6px;
    align-items:center;
}

.remember input{
    width:14px;
    height:14px;
    padding:0;
}

.options a{
    color:#087a52;
    text-decoration:none;
    font-weight:600;
}

.login-btn{
    width:100%;
    height:47px;
    border:0;
    border-radius:10px;
    background:#087a52;
    color:white;
    font-weight:700;
    cursor:pointer;
}

.login-btn:hover{
    background:#075d40;
}

.divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:21px 0;
    color:#9aa39f;
    font-size:11px;
}

.divider::before,
.divider::after{
    content:"";
    height:1px;
    background:#e3e8e5;
    flex:1;
}

.google{
    width:100%;
    height:45px;
    border:1px solid #dce3df;
    background:white;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;
}

.signup{
    text-align:center;
    margin-top:21px;
    font-size:12px;
    color:#69766f;
}

.signup a{
    color:#087a52;
    font-weight:700;
    text-decoration:none;
}

.message{
    display:none;
    padding:11px;
    border-radius:9px;
    font-size:12px;
    margin-bottom:15px;
}

.error{
    display:block;
    background:#fff0ef;
    color:#a33b36;
}

.success{
    display:block;
    background:#e9f7f0;
    color:#087a52;
}

.security{
    margin-top:20px;
    padding:12px;
    background:#f1f7f4;
    color:#587068;
    border-radius:10px;
    font-size:10px;
    text-align:center;
}

@media(max-width:550px){

    .navbar{
        height:auto;
        padding:11px 0;
    }

    .nav-inner{
        flex-wrap:wrap;
    }

    .nav-links{
        width:100%;
        justify-content:flex-end;
    }

    .login-card{
        padding:25px 20px;
    }

}

</style>

</head>


<body>


<header class="navbar">

<div class="nav-inner">

<a href="index.html" class="logo-area">

<div class="logo">SC</div>

<div class="brand">

<h2>SmartCommute</h2>

<p>Hyperlocal Travel Matching</p>

</div>

</a>


<div class="nav-links">

<a href="index.html">
Home
</a>

<a href="register.html" class="nav-btn">
Get Started
</a>

</div>

</div>

</header>


<main class="page">

<div class="login-card">

<a href="index.html" class="back">
← Back to Home
</a>


<div class="icon">
🔐
</div>


<h1>
Welcome back
</h1>

<p class="subtitle">
Login to your SmartCommute account
</p>


<div id="message" class="message"></div>


<form id="loginForm">


<div class="form-group">

<label>
Email Address
</label>

<div class="input">

<span>✉️</span>

<input
type="email"
id="email"
placeholder="Enter your email address"
required
>

</div>

</div>


<div class="form-group">

<label>
Password
</label>

<div class="password">

<input
type="password"
id="password"
placeholder="Enter your password"
required
>

<button
type="button"
onclick="togglePassword()">

👁

</button>

</div>

</div>


<div class="options">

<label class="remember">

<input type="checkbox">

Remember me

</label>

<a href="#">
Forgot password?
</a>

</div>


<button
type="submit"
id="loginBtn"
class="login-btn">

Login

</button>


</form>


<div class="divider">
OR
</div>


<button
class="google"
onclick="alert('Google Sign-In can be enabled later.')">

🌐 &nbsp; Continue with Google

</button>


<div class="signup">

Don't have an account?

<a href="register.html">
Create account
</a>

</div>


<div class="security">

🔒 Your account is protected using Firebase Authentication.

</div>


</div>

</main>


<script type="module">

import { loginUser } from "./firebase-auth.js";


const form =
document.getElementById("loginForm");

const button =
document.getElementById("loginBtn");

const message =
document.getElementById("message");


function showMessage(text,type){

message.textContent=text;

message.className="message "+type;

}


form.addEventListener("submit",async function(e){

e.preventDefault();


const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;


button.disabled=true;

button.textContent="Logging in...";


try{

await loginUser(email,password);


showMessage(
"Login successful. Redirecting...",
"success"
);


setTimeout(()=>{

window.location.href="dashboard.html";

},700);


}catch(error){

console.error(error);


let text="Invalid email or password.";


if(error.code==="auth/user-not-found"){

text="No account found with this email.";

}

if(error.code==="auth/wrong-password"){

text="Incorrect password.";

}

if(error.code==="auth/invalid-credential"){

text="Incorrect email or password.";

}


showMessage(text,"error");


button.disabled=false;

button.textContent="Login";

}

});


window.togglePassword=function(){

const input =
document.getElementById("password");

input.type =
input.type==="password"
? "text"
: "password";

};

</script>


</body>

</html>
